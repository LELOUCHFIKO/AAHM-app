name: Build AAHM Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AAHM APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config ccache \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Cache Android build files
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: aahm-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            aahm-${{ runner.os }}-

      - name: Check configuration
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi
          echo "Buildozer configuration:"
          grep -nE '^(title|package.name|package.domain|source.include_exts|requirements|android.api|android.minapi|android.ndk|p4a.branch)' buildozer.spec || true

      - name: Build APK
        id: build
        continue-on-error: true
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error details
        if: steps.build.outcome != 'success'
        run: |
          echo "========== BUILD LOG: ERROR MATCHES =========="
          grep -in -B 8 -A 12 -E \
            'preadv|pwritev|error:|fatal error:|Traceback|Exception|failed|No such file' \
            build.log | tail -n 250 || true
          echo "========== END ERROR DETAILS =========="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAHM-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AAHM-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "APK build failed. Check the error details above."
          exit 1
