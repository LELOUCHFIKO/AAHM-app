
name: Build AAHM Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config ccache \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" buildozer

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: aahm-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            aahm-${{ runner.os }}-

      - name: Show Android configuration
        run: |
          grep -nE '^(requirements|android.api|android.minapi|android.ndk|android.ndk_api|p4a.branch)' buildozer.spec || true

      - name: Build debug APK
        id: apk
        continue-on-error: true
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AAHM-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AAHM-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Report build failure
        if: steps.apk.outcome != 'success'
        run: |
          echo "APK build failed. Download the AAHM-build-log artifact."
          exit 1
